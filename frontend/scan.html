<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>💈 Barbería - Escanear Cita</title>
  <link rel="stylesheet" href="scan.css" />
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
</head>
<body>
  <!-- 📱 Header con controles -->
  <header class="scanner-header">
    <div class="header-top">
      <h1>💈 Escanear Cita</h1>
      <p id="header-subtitle">Apunta la cámara al QR del cliente</p>
    </div>
    
    <!-- 🔘 Controles: Modo + Cámara -->
    <div class="header-controls">
      <!-- Toggle de modo: Escanear / Manual -->
      <div class="mode-toggle">
        <button id="btn-mode-scan" class="mode-btn active" title="Escanear QR">
          📷 Escanear
        </button>
        <button id="btn-mode-manual" class="mode-btn" title="Ingresar código manual">
          🔤 Manual
        </button>
      </div>
      
      <!-- Botón cambiar cámara (solo en modo escanear) -->
      <button id="toggle-camera" class="btn-icon" title="Cambiar cámara" style="display:none">
        🔄
      </button>
    </div>
  </header>

  <main class="scanner-main">
    <!-- 📷 Área del scanner (solo visible en modo escanear) -->
    <div id="scanner-container">
      <div id="reader" class="qr-reader"></div>
      <div class="scanner-guide">
        <div class="guide-frame"></div>
        <p class="guide-text">Coloca el QR dentro del marco</p>
      </div>
    </div>

    <!-- 🔤 Formulario manual (solo visible en modo manual) -->
    <div id="manual-container" class="manual-container hidden">
      <div class="manual-card">
        <h3>🔤 Ingresar Código de Cita</h3>
        <p class="manual-hint">Copia el ID desde Supabase o del QR generado</p>
        
        <form id="manual-form">
          <div class="form-group">
            <input 
              type="text" 
              id="manual-id" 
              placeholder="ej: a1b2c3d4-xxxx-xxxx-xxxx-xxxxxxxxxxxx"
              autocomplete="off"
              spellcheck="false"
            />
          </div>
          <button type="submit" class="btn-primary" id="btn-manual-search">
            🔍 Buscar Cita
          </button>
        </form>
        
        <p class="manual-tip">
          💡 Tip: El ID tiene formato: <code>xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx</code>
        </p>
      </div>
    </div>

    <!-- 📋 Panel de resultados (compartido) -->
    <div id="scan-result" class="result-panel hidden">
      <div class="result-header">
        <span id="result-icon" class="result-icon">⏳</span>
        <h3 id="result-title">Cargando...</h3>
      </div>
      <div id="result-content" class="result-content"></div>
      <div id="result-actions" class="result-actions hidden"></div>
    </div>
  </main>

  <!-- 🔔 Notificaciones toast -->
  <div id="toast" class="toast hidden"></div>

  <!-- 🎵 Sonido de éxito -->
  <audio id="sound-success" preload="auto">
    <source src="data:audio/wav;base64,UklGRnoGAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQoGAACBhYqFbF1fdJivrJBhNjVgodDbq2EcBj+a2/LDciUFLHPM8uKCNAoq..." type="audio/wav">
  </audio>

  <script src="scan.js"></script>
</body>
</html>
