<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>💈 Portal de Empleados - Barbería</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="portal-body">
  <div class="portal-container">
    <div class="portal-card">
      <h1>💈 Portal de Empleados</h1>
      <p class="subtitle">Inicia sesión para acceder a tu panel</p>
      
      <form id="login-form">
        <div class="form-group">
          <label for="email">📧 Correo electrónico</label>
          <input type="email" id="email" required placeholder="tu@barbershop.local" autocomplete="email" />
        </div>
        <div class="form-group">
          <label for="password">🔑 Contraseña</label>
          <input type="password" id="password" required placeholder="••••••••" autocomplete="current-password" />
        </div>
        <div id="login-error" class="error-msg" style="display:none;"></div>
        <button type="submit" id="login-btn" class="btn-primary">🔐 Iniciar Sesión</button>
      </form>
      
      <div class="portal-footer">
        <small>¿Eres cliente? <a href="../" target="_blank">Agenda tu cita aquí</a></small>
      </div>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
